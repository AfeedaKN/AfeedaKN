<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="heroTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#1e293b"/>
    </pattern>
  </defs>

  <!-- Panel Background -->
  <rect width="900" height="280" rx="12" fill="url(#panelGrad)" stroke="#2a3447" stroke-width="1.5"/>
  <rect x="1" y="44" width="898" height="234" fill="url(#dotGrid)" opacity="0.6"/>

  <!-- Window Header Bar -->
  <line x1="0" y1="44" x2="900" y2="44" stroke="#2a3447" stroke-width="1"/>
  <circle cx="28" cy="22" r="5.5" fill="#f87171"/>
  <circle cx="48" cy="22" r="5.5" fill="#fbbf24"/>
  <circle cx="68" cy="22" r="5.5" fill="#34d399"/>
  <text x="92" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12" fill="#64748b" letter-spacing="0.5">terminal ~ afeeda@github</text>

  <!-- Pulsing Learning in Public Status Dot -->
  <circle cx="726" cy="22" r="4" fill="#2dd4bf" opacity="0.4">
    <animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="726" cy="22" r="4.5" fill="#2dd4bf"/>
  <text x="742" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12" font-weight="600" fill="#2dd4bf" letter-spacing="0.3">learning in public</text>

  <!-- Drifting Ambient Dots -->
  <circle cx="160" cy="100" r="1.5" fill="#38bdf8">
    <animate attributeName="cy" values="100;88;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="180" r="1.5" fill="#a78bfa">
    <animate attributeName="cy" values="180;192;180" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="120" r="1.5" fill="#2dd4bf">
    <animate attributeName="cy" values="120;108;120" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Content Area -->
  <text x="48" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" fill="#64748b">&gt; whoami</text>

  <!-- Gradient Title with Fade-in -->
  <text x="48" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="42" font-weight="700" fill="url(#heroTitleGrad)" opacity="0">
    Afeeda KN
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
  </text>

  <!-- Typing Prompt -->
  <text x="48" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="18" fill="#fbbf24">&gt;</text>

  <!-- Cycling Phrases with Deterministic textLength -->
  <text x="72" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="18" font-weight="500" fill="#e6edf3" textLength="310" lengthAdjust="spacingAndGlyphs" opacity="0">
    Full-stack developer · MERN
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.29;0.33;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <text x="72" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="18" font-weight="500" fill="#e6edf3" textLength="350" lengthAdjust="spacingAndGlyphs" opacity="0">
    Auth flows, APIs &amp; data models
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.62;0.66;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <text x="72" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="18" font-weight="500" fill="#e6edf3" textLength="365" lengthAdjust="spacingAndGlyphs" opacity="0">
   TypeScript &amp; PostgreSQL
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.95;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- Blinking Caret Following Active Line -->
  <rect y="171" width="9" height="20" rx="1.5" fill="#2dd4bf">
    <animate attributeName="x" values="390;390;430;430;445;445;390" keyTimes="0;0.33;0.3301;0.66;0.6601;0.9999;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.75s" repeatCount="indefinite"/>
  </rect>

  <!-- Terminal Footer Information -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" fill="#64748b">
    <text x="48" y="240">STACK: <tspan fill="#94a3b8">Node.js · Express · MongoDB · React</tspan></text>
    <text x="640" y="240">LOC: <tspan fill="#94a3b8">Ernakulam, Kerala, IN</tspan></text>
  </g>

  <!-- Light Sweep Along Bottom Edge -->
  <rect x="-240" y="278" width="240" height="2" rx="1" fill="url(#sweepGrad)">
    <animate attributeName="x" values="-240;900" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
