<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230">
  <defs>
    <linearGradient id="rfPanelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <!-- Panel Background -->
  <rect width="900" height="230" rx="12" fill="url(#rfPanelGrad)" stroke="#2a3447" stroke-width="1.5"/>

  <!-- Top Title / Header -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
    <text x="32" y="28" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.2">REQUEST &amp; RESPONSE LIFECYCLE (MERN ARCHITECTURE)</text>
    <text x="760" y="28" font-size="11" fill="#475569">LOOP: 7.0s</text>
  </g>
  <line x1="32" y1="36" x2="868" y2="36" stroke="#1e293b" stroke-width="1"/>

  <!-- Packet Track Line -->
  <line x1="110" y1="140" x2="790" y2="140" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Vertical Node Connectors to Track -->
  <line x1="110" y1="104" x2="110" y2="140" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="280" y1="104" x2="280" y2="140" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="450" y1="104" x2="450" y2="140" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="620" y1="104" x2="620" y2="140" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="790" y1="104" x2="790" y2="140" stroke="#1e293b" stroke-width="1.5"/>

  <!-- NODE 1: React Client -->
  <g>
    <rect x="45" y="48" width="130" height="56" rx="8" fill="#131d31" stroke="#2a3447" stroke-width="1.2">
      <animate attributeName="stroke" values="#fbbf24;#fbbf24;#2a3447;#2a3447;#2dd4bf;#2dd4bf;#2a3447;#fbbf24" keyTimes="0;0.08;0.12;0.90;0.93;0.97;0.99;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2;2;1.2;1.2;2;2;1.2;2" keyTimes="0;0.08;0.12;0.90;0.93;0.97;0.99;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="110" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#e6edf3">React Client</text>
    <text x="110" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="10" fill="#8b949e">State &amp; Axios</text>
  </g>

  <!-- NODE 2: Express Route -->
  <g>
    <rect x="215" y="48" width="130" height="56" rx="8" fill="#131d31" stroke="#2a3447" stroke-width="1.2">
      <animate attributeName="stroke" values="#2a3447;#2a3447;#fbbf24;#2a3447;#2a3447;#2dd4bf;#2a3447;#2a3447" keyTimes="0;0.10;0.18;0.26;0.80;0.86;0.90;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.2;1.2;2;1.2;1.2;2;1.2;1.2" keyTimes="0;0.10;0.18;0.26;0.80;0.86;0.90;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#e6edf3">Express Route</text>
    <text x="280" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="10" fill="#8b949e">/api endpoint</text>
  </g>

  <!-- NODE 3: Auth Middleware -->
  <g>
    <rect x="385" y="48" width="130" height="56" rx="8" fill="#131d31" stroke="#2a3447" stroke-width="1.2">
      <animate attributeName="stroke" values="#2a3447;#2a3447;#fbbf24;#2a3447;#2a3447;#2dd4bf;#2a3447;#2a3447" keyTimes="0;0.24;0.32;0.40;0.68;0.74;0.80;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.2;1.2;2;1.2;1.2;2;1.2;1.2" keyTimes="0;0.24;0.32;0.40;0.68;0.74;0.80;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#e6edf3">Auth Guard</text>
    <text x="450" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="10" fill="#8b949e">JWT / Session</text>
  </g>

  <!-- NODE 4: Controller -->
  <g>
    <rect x="555" y="48" width="130" height="56" rx="8" fill="#131d31" stroke="#2a3447" stroke-width="1.2">
      <animate attributeName="stroke" values="#2a3447;#2a3447;#fbbf24;#2a3447;#2a3447;#2dd4bf;#2a3447;#2a3447" keyTimes="0;0.36;0.44;0.50;0.58;0.64;0.70;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.2;1.2;2;1.2;1.2;2;1.2;1.2" keyTimes="0;0.36;0.44;0.50;0.58;0.64;0.70;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="620" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#e6edf3">Controller</text>
    <text x="620" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="10" fill="#8b949e">Business Logic</text>
  </g>

  <!-- NODE 5: MongoDB -->
  <g>
    <rect x="725" y="48" width="130" height="56" rx="8" fill="#131d31" stroke="#2a3447" stroke-width="1.2">
      <animate attributeName="stroke" values="#2a3447;#2a3447;#fbbf24;#2dd4bf;#2a3447;#2a3447" keyTimes="0;0.46;0.50;0.56;0.62;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.2;1.2;2;2;1.2;1.2" keyTimes="0;0.46;0.50;0.56;0.62;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="790" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#e6edf3">MongoDB</text>
    <text x="790" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="10" fill="#8b949e">Mongoose Query</text>
  </g>

  <!-- Amber Request Packet Travelling Forward (0.0 to 0.50) -->
  <circle cy="140" r="10" fill="#fbbf24">
    <animate attributeName="cx" values="110;280;450;620;790;790;110;110" keyTimes="0;0.14;0.28;0.40;0.50;0.99;0.9901;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.4;0.4;0.4;0.4;0;0;0.4" keyTimes="0;0.14;0.28;0.40;0.50;0.51;0.99;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cy="140" r="5" fill="#fbbf24">
    <animate attributeName="cx" values="110;280;450;620;790;790;110;110" keyTimes="0;0.14;0.28;0.40;0.50;0.99;0.9901;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;1;1;0;0;1" keyTimes="0;0.14;0.28;0.40;0.50;0.51;0.99;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Teal Response Packet Returning Backward (0.50 to 0.94) -->
  <circle cy="140" r="10" fill="#2dd4bf">
    <animate attributeName="cx" values="790;790;620;450;280;110;110;790" keyTimes="0;0.50;0.60;0.70;0.82;0.94;0.99;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.4;0.4;0.4;0.4;0;0" keyTimes="0;0.49;0.50;0.60;0.70;0.82;0.94;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cy="140" r="5" fill="#2dd4bf">
    <animate attributeName="cx" values="790;790;620;450;280;110;110;790" keyTimes="0;0.50;0.60;0.70;0.82;0.94;0.99;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;1;1;0;0" keyTimes="0;0.49;0.50;0.60;0.70;0.82;0.94;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Flow Direction Labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="11">
    <text x="450" y="132" text-anchor="middle" fill="#fbbf24" opacity="0.75">HTTP DISPATCH →</text>
    <text x="450" y="160" text-anchor="middle" fill="#2dd4bf" opacity="0.75">← SERIALIZED PAYLOAD</text>
  </g>

  <!-- "200 OK + JSON" Badge -->
  <g>
    <rect x="45" y="180" width="130" height="28" rx="14" fill="#0b2420" stroke="#2dd4bf" stroke-width="1.2">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.91;0.93;0.98;0.99;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="110" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#2dd4bf">
      200 OK + JSON
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.91;0.93;0.98;0.99;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Database Latency / Status Tag at Right -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="11" fill="#64748b">
    <text x="790" y="198" text-anchor="middle">ATLAS CLUSTER</text>
  </g>
</svg>
